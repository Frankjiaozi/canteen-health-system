[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "canteen-api"
version = "0.1.0"
description = "知味 · 校园智慧膳食平台 —— 后端服务（营养核算、采购预测、决策支持）"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.54.0",
    "sqlalchemy>=2.1.4",
    "alembic>=1.20.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.0",
    "pyjwt>=2.15.1",
    "pwdlib[bcrypt]>=0.3.1",
    "python-multipart>=0.0.32",
    # Excel 批量导入（20 道菜的配方靠界面逐条敲要几个小时）
    "openpyxl>=3.1.5",
    # 菜单推荐的整数规划。**上界卡在 3 以下**：PuLP 4.x 不再自带求解器
    # （装完 listSolvers 是空的），参数名也换了一套；需求要的是「自带 CBC」的那一版。
    "pulp>=2.9,<3",
    # 周报月报导出 PDF 会用到 reportlab（纯 Python、Windows 不需要额外系统库），
    # 那个模块还没做，所以先不引入——装一个没人用的依赖只会拖慢构建
    # AI 助手调用模型端点（任何 OpenAI 兼容的 /chat/completions）
    "httpx>=0.28.1",
    "tzdata>=2026.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "mypy>=2.4.0",
    # openpyxl 不带类型标注，mypy 需要这份第三方 stub
    "types-openpyxl>=3.1.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------------------
# Ruff：风格与静态检查
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["app", "tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff 自有规则
    "N",   # pep8-naming
    "DTZ", # 时区相关（本项目要求显式时区）
    "T20", # 禁止 print（日志统一走 logger）
]
ignore = [
    "E501", # 行长由 ruff format 处理
    "B008", # FastAPI 的 Depends() 必须写在默认值里
    "RUF001",
    "RUF002",
    "RUF003", # 中文全角标点属正常书写
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
"app/db/seed.py" = ["T20"]
"app/openapi_export.py" = ["T20"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy：静态类型检查
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
files = ["app"]
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true
exclude = ["^alembic/"]

[[tool.mypy.overrides]]
# PuLP 不带类型标注，也没有官方 stub；求解器的调用面很窄，不值得为它写一层封装
module = ["pulp"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "integration: 需要真实 PostgreSQL 的集成测试",
]
