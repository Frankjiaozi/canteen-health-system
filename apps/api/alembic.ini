; NOTE: This file must stay ASCII-only.
; Alembic reads the ini with the system locale encoding (e.g. GBK on zh-CN Windows),
; so non-ASCII comments here would raise UnicodeDecodeError before migrations run.

[alembic]
script_location = alembic
; Make the `app` package importable (commands are run from apps/api).
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
timezone = Asia/Shanghai
version_path_separator = os

; The database URL is intentionally absent: alembic/env.py loads it from
; app.core.config so the connection string lives in exactly one place (.env).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
